<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GestiEdu</title>
    <!--
        ESTA PANTALLA SOLO SE VE CUANDO NO HAY INTERNET

        La app no lleva el sistema dentro: enseña el del liceo, que vive en su
        servidor (`server.url` en capacitor.config.json). Eso es lo correcto —el
        liceo cambia una nota y se ve en el acto, sin que nadie actualice nada
        desde la tienda—, pero tiene una consecuencia: sin conexión, la app
        abriría el error feo del navegador, ese de "ERR_INTERNET_DISCONNECTED"
        con letra pequeña.

        Android enseña estos archivos cuando no alcanza el servidor. Por eso
        esto existe: para que sin señal se vea algo escrito para una persona, y
        con un botón para volver a intentarlo.
    -->
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
            background: #f5f6f9;
            color: #0f172a;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }

        .marca {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: #2563eb;
            display: grid;
            place-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
        }

        p {
            margin: 0;
            max-width: 22rem;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #475569;
        }

        button {
            min-height: 48px;
            padding: 0 24px;
            border: 0;
            border-radius: 14px;
            background: #2563eb;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        button:active {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <span class="marca" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 14L12 24L32 34L52 24L32 14Z" fill="#FFFFFF" />
            <path d="M19 28.5V40.5C19 40.5 24 45 32 45C40 45 45 40.5 45 40.5V28.5L32 35L19 28.5Z" fill="#FFFFFF"
                fill-opacity="0.9" />
        </svg>
    </span>

    <h1>No hay conexión</h1>
    <p>
        La aplicación necesita internet para mostrar el liceo. Revisa los datos o
        el wifi y vuelve a intentarlo.
    </p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</body>

</html>
