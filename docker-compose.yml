services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env.example
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - web_node_modules:/app/node_modules
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env.example
    volumes:
      - ./apps/backend/src:/app/src
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
  postgres:
    build: ./docker/postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gestion_escolar
      POSTGRES_USER: gestion_user
      POSTGRES_PASSWORD: gestion_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    build: ./docker/redis
    ports:
      - '6379:6379'
  nginx:
    build: ./docker/nginx
    ports:
      - '80:80'
    depends_on:
      - web
      - backend

volumes:
  postgres_data:
  web_node_modules:
  backend_node_modules:
