# Producción.
#
# Diferencias con la versión anterior de este archivo, que no era usable:
#   - PostgreSQL guarda sus datos en un volumen (antes se perdían al reiniciar);
#   - las variables salen de .env.production, no de .env.example;
#   - PgBouncer reparte las conexiones: con una base por liceo, sin él se agota
#     PostgreSQL en cuanto hay unas decenas de liceos activos;
#   - un servicio `migrator` aplica las migraciones a la plataforma y a TODOS los
#     liceos antes de que arranque el backend;
#   - nadie más que nginx expone puertos al exterior.
#
# Copia .env.production.example a .env.production y rellénalo antes de levantar.

services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_escolar_platform}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 200 liceos abren muchas conexiones; PgBouncer las reparte, pero el
    # servidor necesita margen igualmente.
    command: postgres -c max_connections=200 -c shared_buffers=512MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Modo transacción: cada consulta toma una conexión libre y la devuelve.
      # Es lo que permite que cientos de clientes compartan pocas conexiones.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      DEFAULT_POOL_SIZE: 20
      # Necesario para que PgBouncer acepte bases que no están listadas una a una
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  redis:
    build: ./docker/redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  # Un solo paso, antes del backend: migra la plataforma y luego cada liceo.
  # Si algún liceo falla, termina con error y el backend no arranca.
  migrator:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: 'no'
    env_file: [.env.production]
    environment:
      # Las migraciones van directas a PostgreSQL: PgBouncer en modo transacción
      # no mantiene los bloqueos que Prisma Migrate necesita.
      PGBOUNCER_HOST: ''
    command: >
      sh -c "npx prisma migrate deploy --schema=src/prisma/platform-schema.prisma &&
             npx tsx src/scripts/migrate-all-tenants.ts"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 6432
      TENANT_CONNECTION_LIMIT: ${TENANT_CONNECTION_LIMIT:-2}
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: [.env.production]
    depends_on: [backend]
    networks: [interna]

  nginx:
    build: ./docker/nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Los certificados. SIN ESTO NGINX NO ARRANCA, a propósito: antes
      # arrancaba sin cifrado y, como las llaves de sesión van marcadas
      # `Secure`, nadie podía entrar y no se veía el motivo por ninguna parte.
      # Ahora falla al desplegar, diciendo qué falta. Ver docs/DESPLIEGUE.md.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      # Donde Let's Encrypt deja la prueba de que el dominio es tuyo, para
      # poder renovar sin tirar el sitio.
      - ./docker/nginx/certbot:/var/www/certbot
    depends_on: [web, backend]
    networks: [interna]

volumes:
  postgres_data:
  redis_data:

networks:
  interna:
    driver: bridge
