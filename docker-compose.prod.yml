# Producción.
#
# Diferencias con la versión anterior de este archivo, que no era usable:
#   - PostgreSQL guarda sus datos en un volumen (antes se perdían al reiniciar);
#   - las variables salen de .env.production, no de .env.example;
#   - PgBouncer reparte las conexiones: con una base por liceo, sin él se agota
#     PostgreSQL en cuanto hay unas decenas de liceos activos;
#   - un servicio `migrator` aplica las migraciones a la plataforma y a TODOS los
#     liceos antes de que arranque el backend;
#   - nadie más que nginx expone puertos al exterior.
#
# Copia .env.production.example a .env.production y rellénalo antes de levantar.

services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_escolar_platform}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 200 liceos abren muchas conexiones; PgBouncer las reparte, pero el
    # servidor necesita margen igualmente.
    command: postgres -c max_connections=200 -c shared_buffers=512MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Modo transacción: cada consulta toma una conexión libre y la devuelve.
      # Es lo que permite que cientos de clientes compartan pocas conexiones.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 2000
      # DIMENSIONADO PARA 200 LICEOS, NO PARA 10
      # El tamaño del grupo es POR BASE, y hay una base por liceo: con 20, 200
      # liceos podían pedir 4.000 conexiones a un PostgreSQL que da 200. Ahora
      # 5 por liceo (el mejor valor medido, docs/DESPLIEGUE.md §5), y un tope
      # para todas juntas por debajo de max_connections, dejando sitio a la
      # plataforma, las migraciones y los respaldos, que van directos. Las que
      # llevan un minuto sin usarse se sueltan para los liceos con gente dentro.
      DEFAULT_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 5
      MAX_USER_CONNECTIONS: 160
      SERVER_IDLE_TIMEOUT: 60
      # Necesario para que PgBouncer acepte bases que no están listadas una a una
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  redis:
    build: ./docker/redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]

  # Un solo paso, antes del backend: migra la plataforma y luego cada liceo.
  # Si algún liceo falla, termina con error y el backend no arranca.
  migrator:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: 'no'
    env_file: [.env.production]
    environment:
      # Las migraciones van directas a PostgreSQL: PgBouncer en modo transacción
      # no mantiene los bloqueos que Prisma Migrate necesita.
      PGBOUNCER_HOST: ''
    # El guion va COMPILADO: la imagen no lleva ni el código fuente de los
    # guiones ni `tsx` (antes decía `npx tsx src/scripts/...`, que no existía
    # dentro de la imagen, así que el migrador fallaba y el backend no arrancaba).
    # La plataforma, con SUS migraciones (src/prisma/plataforma/migrations): su
    # esquema estaba junto al de los liceos y `migrate deploy` le aplicaba las
    # de los liceos. Ver src/scripts/migrar-plataforma.ts.
    command: >
      sh -c "node dist/scripts/migrar-plataforma.js &&
             node dist/scripts/migrate-all-tenants.js"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PGBOUNCER_HOST: pgbouncer
      PGBOUNCER_PORT: 6432
      TENANT_CONNECTION_LIMIT: ${TENANT_CONNECTION_LIMIT:-5}
      # El puerto va FIJO aquí, porque nginx y la sonda de salud lo esperan en
      # el 4000. Antes lo decía solo .env.production y nginx apuntaba al 3001:
      # toda la API respondía 502 en cuanto alguien usara el ejemplo tal cual.
      PUERTO_DEL_HOST: '4000'
      BACKUP_DIR: /app/backups
      APP_MOVIL_DIR: /app/apks
    volumes:
      # Las APK que las apps ya instaladas se bajan solas al abrirse
      # (`npm run publicar` en apps/movil; ver docs/APP-MOVIL.md). Publicar
      # una es dejar sus dos archivos en `apks/`, junto a este archivo.
      - ./apks:/app/apks:ro
      # Los logos subidos ANTES de que fueran a la base (los nuevos van a la
      # base de la plataforma: los ven todos los procesos y entran en el
      # respaldo). Sin volumen vivían DENTRO del contenedor, y cada
      # despliegue crea uno nuevo: se perdían en cada actualización.
      - uploads:/app/uploads
      # Solo para leer cómo fue el último respaldo (panel del superadmin).
      - respaldos:/app/backups:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [interna]

  # Los respaldos, solos, cada noche (HORA_DE_RESPALDO, 02:00 por defecto).
  # Van directos a PostgreSQL, no por PgBouncer. Si se configuran
  # BACKUP_S3_*, cada respaldo se sube además fuera del servidor.
  # Ver src/services/respaldos-programados.service.ts y docs/DESPLIEGUE.md §8.
  respaldos:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PGBOUNCER_HOST: ''
      BACKUP_DIR: /app/backups
      TZ: ${TZ:-America/Caracas}
    command: node dist/scripts/respaldos-cada-noche.js
    volumes:
      - respaldos:/app/backups
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: [.env.production]
    depends_on: [backend]
    networks: [interna]

  nginx:
    build: ./docker/nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Los certificados. SIN ESTO NGINX NO ARRANCA, a propósito: antes
      # arrancaba sin cifrado y, como las llaves de sesión van marcadas
      # `Secure`, nadie podía entrar y no se veía el motivo por ninguna parte.
      # Ahora falla al desplegar, diciendo qué falta. Ver docs/DESPLIEGUE.md.
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      # Donde Let's Encrypt deja la prueba de que el dominio es tuyo, para
      # poder renovar sin tirar el sitio.
      - ./docker/nginx/certbot:/var/www/certbot
    depends_on: [web, backend]
    networks: [interna]

volumes:
  postgres_data:
  redis_data:
  uploads:
  respaldos:

networks:
  interna:
    driver: bridge
