# ─────────────────────────────────────────────────────────────────────────────
# EL REPARTIDOR QUE VA DELANTE DEL SISTEMA
#
# Lo que había aquí era un esqueleto: escuchaba solo en el puerto 80, sin
# cifrado, y le faltaban tres cosas que rompen el sistema en producción. Se
# encontraron mirando por qué el tiempo real se caía a pedir por HTTP:
#
#   1. NO HABÍA HTTPS. El `docker-compose.prod.yml` abre el puerto 443 y monta
#      los certificados en /etc/nginx/certs, pero nginx nunca los usaba. Y en
#      producción las llaves de sesión van marcadas `Secure`, o sea que el
#      navegador **no las manda por conexión sin cifrar**: nadie habría podido
#      entrar. Falla ruidosamente, que es la única buena noticia.
#
#   2. NO PASABA LAS CONEXIONES DE TIEMPO REAL. Sin las cabeceras `Upgrade` y
#      `Connection`, la conexión permanente no se puede establecer y el sistema
#      se cae a preguntar por HTTP cada poco. Sigue funcionando, pero gastando
#      mucho más y llegando más tarde — justo lo contrario de lo que se midió y
#      se prometió ("lo que otro guarda se ve al instante").
#
#   3. NO DECÍA DE DÓNDE VENÍA CADA PERSONA. Sin `X-Forwarded-For`, al servidor
#      le llegan todas las peticiones desde la dirección de nginx: las
#      doscientas personas de un liceo parecen una sola, y comparten cupo. Es el
#      mismo fallo que ya se corrigió dos veces dentro del código.
#
# ─── POR QUÉ SE ESCRIBE, NO SE AÑADE ─────────────────────────────────────────
#
# `proxy_set_header X-Forwarded-For $remote_addr` **escribe** la cabecera; no
# la añade a lo que trajera el cliente. Si se añadiera (`$proxy_add_x_forwarded_for`),
# cualquiera podría poner una dirección inventada delante y el servidor se la
# creería. Escribiéndola, la única dirección que llega es la de verdad.
#
# El servidor, por su parte, solo acepta esta cabecera desde direcciones
# internas: ver `apps/backend/src/config/de-quien-nos-fiamos.ts`.
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # Los archivos que suben los liceos (logos, adjuntos). El límite real lo
    # pone el servidor; aquí solo se deja pasar hasta ahí.
    client_max_body_size 25m;

    # No decir qué versión de nginx corre: es información gratis para quien
    # busque un fallo conocido de esa versión concreta.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Para poder pasar las conexiones permanentes de tiempo real. Una petición
    # normal no lleva `Connection` (vacío = no se manda): así la conexión con
    # el proceso se reutiliza (`keepalive` de los `upstream`).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Los procesos del servidor de datos ─────────────────────────────────
    #
    # Con `docker compose up -d --scale backend=N`, el nombre `backend`
    # resuelve a N direcciones y nginx las reparte. OJO: nginx lo resuelve al
    # arrancar; si se cambia N con nginx ya en marcha, hay que recargarlo
    # (`docker compose exec nginx nginx -s reload`).
    #
    # Dos repartos distintos, a propósito:
    #
    #   · La API va al proceso menos ocupado. Ya no guarda nada en la memoria
    #     del proceso que importe: el cupo de peticiones y el freno del doble
    #     clic están en Redis, y los logos en la base.
    #   · El tiempo real, siempre al MISMO proceso para la misma dirección. Si
    #     la conexión permanente no se puede abrir, socket.io pregunta por HTTP
    #     cada poco, y cada pregunta tiene que caer en el proceso que abrió la
    #     sesión o responde «sesión desconocida». Los avisos entre procesos los
    #     reparte Redis.
    upstream api {
        least_conn;
        server backend:4000;
        keepalive 64;
    }

    upstream tiempo_real {
        hash $binary_remote_addr consistent;
        server backend:4000;
    }

    # ── Todo lo que llegue sin cifrar se manda a la puerta cifrada ───────────
    server {
        listen      80;
        listen      [::]:80;
        server_name _;

        # Lo que usa Let's Encrypt para comprobar el dominio. Tiene que seguir
        # siendo accesible sin cifrar o no se pueden renovar los certificados.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── La puerta de verdad ─────────────────────────────────────────────────
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2       on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # "A este sitio, de aquí en adelante, solo por conexión cifrada."
        # Evita el primer viaje sin cifrar, que es donde se roban las sesiones.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Lo que vale para todos los destinos de abajo.
        #
        # TODAS las cabeceras van aquí, y NINGUNA dentro de un `location`: en
        # nginx, un solo `proxy_set_header` dentro de un `location` hace que ese
        # `location` deje de heredar TODOS los de aquí. Así estaba el del tiempo
        # real (ponía `Upgrade` y `Connection` y perdía el resto): al servidor
        # le llegaba sin `Host` ni `X-Forwarded-For`, o sea sin el liceo del
        # dominio y con todas las personas saliendo de la dirección de nginx.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # SE ESCRIBE, no se añade: ver la nota de arriba.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Conexiones permanentes (tiempo real, y la recarga en caliente de
        # Next.js). En una petición normal van vacías: ver el `map` de arriba.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ── Tiempo real ─────────────────────────────────────────────────────
        # Va primero y aparte porque necesita que la conexión se quede abierta.
        location /socket.io/ {
            proxy_pass http://tiempo_real;

            # Una conexión de tiempo real está callada largos ratos: sin esto,
            # nginx la corta al minuto y el navegador se pasa a preguntar por
            # HTTP, que es lo que se vino a arreglar.
            proxy_read_timeout  7d;
            proxy_send_timeout  7d;
            proxy_buffering     off;
        }

        # ── La API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api;
        }

        # Los archivos que sirve el servidor (logos de los liceos).
        location /uploads/ {
            proxy_pass http://api;
        }

        # ── Las pantallas ───────────────────────────────────────────────────
        location / {
            proxy_pass http://web:3000;
        }
    }
}
